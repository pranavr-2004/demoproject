<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PRANAV — The Vanam</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
            background: #02010a;
            color: white;
        }

        /* =========================================
           ANIMATED BACKGROUND
        ========================================= */

        .background {
            position: fixed;
            inset: 0;

            background:
                radial-gradient(
                    circle at 20% 30%,
                    #5b21b6 0%,
                    transparent 30%
                ),
                radial-gradient(
                    circle at 80% 70%,
                    #0891b2 0%,
                    transparent 30%
                ),
                radial-gradient(
                    circle at 50% 50%,
                    #111827 0%,
                    #02010a 70%
                );

            animation: backgroundMove 10s ease-in-out infinite alternate;
        }

        @keyframes backgroundMove {

            0% {
                transform: scale(1);
                filter: hue-rotate(0deg);
            }

            100% {
                transform: scale(1.15);
                filter: hue-rotate(40deg);
            }
        }


        /* =========================================
           MOVING GRID
        ========================================= */

        .grid {
            position: fixed;
            inset: 0;

            background-image:
                linear-gradient(
                    rgba(255,255,255,0.035) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(255,255,255,0.035) 1px,
                    transparent 1px
                );

            background-size: 50px 50px;

            transform:
                perspective(500px)
                rotateX(60deg)
                scale(2);

            transform-origin: center bottom;

            opacity: 0.4;

            animation: gridMove 8s linear infinite;
        }

        @keyframes gridMove {

            from {
                background-position: 0 0;
            }

            to {
                background-position: 0 50px;
            }
        }


        /* =========================================
           GLOWING ORBS
        ========================================= */

        .orb {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            filter: blur(2px);
        }

        .orb.one {

            width: 220px;
            height: 220px;

            background: #7c3aed;

            opacity: 0.15;

            top: 10%;
            left: 10%;

            animation: orbOne 7s infinite alternate;
        }

        .orb.two {

            width: 280px;
            height: 280px;

            background: #06b6d4;

            opacity: 0.12;

            bottom: 5%;
            right: 10%;

            animation: orbTwo 9s infinite alternate;
        }

        @keyframes orbOne {

            to {
                transform:
                    translate(200px, 150px)
                    scale(1.5);
            }
        }

        @keyframes orbTwo {

            to {
                transform:
                    translate(-180px, -100px)
                    scale(1.3);
            }
        }


        /* =========================================
           PARTICLES
        ========================================= */

        .particle {

            position: fixed;

            width: 5px;
            height: 5px;

            border-radius: 50%;

            background: white;

            box-shadow:
                0 0 10px white,
                0 0 20px #8b5cf6;

            animation:
                particleMove linear infinite;
        }

        @keyframes particleMove {

            from {
                transform: translateY(110vh);
                opacity: 0;
            }

            20% {
                opacity: 1;
            }

            80% {
                opacity: 1;
            }

            to {
                transform: translateY(-10vh);
                opacity: 0;
            }
        }


        /* =========================================
           MAIN CONTAINER
        ========================================= */

        .main {

            position: relative;

            z-index: 5;

            height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            text-align: center;

            perspective: 1000px;
        }


        /* =========================================
           GLASS CARD
        ========================================= */

        .content {

            padding: 60px 80px;

            max-width: 850px;

            border: 1px solid rgba(255,255,255,0.15);

            border-radius: 30px;

            background:
                rgba(255,255,255,0.06);

            backdrop-filter: blur(25px);

            -webkit-backdrop-filter: blur(25px);

            box-shadow:

                0 0 50px
                rgba(139,92,246,0.25),

                inset 0 0 40px
                rgba(255,255,255,0.03);

            animation:
                appear 1.5s ease forwards;

            transform-style: preserve-3d;

            transition:
                transform 0.15s ease-out;
        }

        @keyframes appear {

            from {

                opacity: 0;

                transform:
                    translateY(80px)
                    rotateX(25deg)
                    scale(0.8);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0)
                    rotateX(0)
                    scale(1);
            }
        }


        /* =========================================
           SMALL TITLE
        ========================================= */

        .small {

            font-size: 14px;

            letter-spacing: 8px;

            text-transform: uppercase;

            color: #a78bfa;

            margin-bottom: 25px;

            animation: fadeIn 2s ease;
        }


        /* =========================================
           MAIN NAME
        ========================================= */

        h1 {

            font-size:
                clamp(65px, 11vw, 150px);

            font-weight: 900;

            line-height: 0.9;

            letter-spacing: -7px;

            background:

                linear-gradient(
                    90deg,
                    #ffffff,
                    #a78bfa,
                    #22d3ee,
                    #ffffff
                );

            background-size: 300% auto;

            -webkit-background-clip: text;
            background-clip: text;

            color: transparent;

            animation:

                gradientText 5s linear infinite,

                textGlow
                2s ease-in-out infinite alternate;
        }

        @keyframes gradientText {

            from {
                background-position: 0% center;
            }

            to {
                background-position: 300% center;
            }
        }

        @keyframes textGlow {

            from {

                filter:
                    drop-shadow(
                        0 0 5px #8b5cf6
                    );
            }

            to {

                filter:
                    drop-shadow(
                        0 0 30px #22d3ee
                    );
            }
        }


        /* =========================================
           TYPING TEXT
        ========================================= */

        .subtitle {

            margin-top: 30px;

            font-size: 18px;

            letter-spacing: 5px;

            color:
                rgba(255,255,255,0.7);

            text-transform: uppercase;

            min-height: 25px;
        }

        #typing {

            color: #22d3ee;

            border-right:
                2px solid #22d3ee;

            padding-right: 6px;

            animation:
                cursorBlink 0.7s infinite;
        }

        @keyframes cursorBlink {

            50% {
                border-color: transparent;
            }
        }


        /* =========================================
           BIO
        ========================================= */

        .bio {

            margin-top: 28px;

            font-size: 17px;

            line-height: 1.8;

            color:
                rgba(255,255,255,0.65);
        }


        /* =========================================
           STATS
        ========================================= */

        .stats {

            display: flex;

            justify-content: center;

            gap: 60px;

            margin-top: 35px;
        }

        .stats div {

            display: flex;

            flex-direction: column;

            gap: 7px;
        }

        .stats strong {

            font-size: 26px;

            color: white;
        }

        .stats span {

            font-size: 10px;

            letter-spacing: 3px;

            text-transform: uppercase;

            color: #a78bfa;
        }


        /* =========================================
           BUTTON
        ========================================= */

        .button {

            display: inline-block;

            margin-top: 40px;

            padding:
                15px 35px;

            color: white;

            text-decoration: none;

            border:
                1px solid
                rgba(255,255,255,0.3);

            border-radius: 50px;

            background:
                rgba(255,255,255,0.08);

            transition:
                0.4s;

            position: relative;

            overflow: hidden;
        }

        .button::before {

            content: "";

            position: absolute;

            top: 0;
            left: -100%;

            width: 100%;
            height: 100%;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,255,255,0.4),
                    transparent
                );

            transition: 0.6s;
        }

        .button:hover::before {

            left: 100%;
        }

        .button:hover {

            transform:
                scale(1.1);

            box-shadow:

                0 0 20px #8b5cf6,

                0 0 50px #22d3ee;
        }


        /* =========================================
           FADE IN
        ========================================= */

        @keyframes fadeIn {

            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media(max-width: 600px) {

            .content {

                width: 92%;

                padding:
                    50px 20px;

                border-radius: 25px;
            }

            h1 {

                font-size: 65px;

                letter-spacing:
                    -4px;
            }

            .small {

                font-size: 10px;

                letter-spacing: 5px;
            }

            .subtitle {

                font-size: 12px;

                letter-spacing: 3px;
            }

            .bio {

                font-size: 14px;
            }

            .stats {

                gap: 25px;
            }

            .stats strong {

                font-size: 21px;
            }

            .stats span {

                font-size: 8px;

                letter-spacing: 2px;
            }

            .button {

                padding:
                    13px 25px;

                font-size: 13px;
            }
        }

    </style>
</head>

    <script>


        /* =========================================
           TYPING EFFECT
        ========================================= */

        const words = [

            "THE DREAMER",

            "THE CHAOTIC ONE",

            "THE VIBE",

            "THE LEGEND",

            "THE VANAM"

        ];


        let wordIndex = 0;

        let charIndex = 0;

        let deleting = false;


        function typeEffect() {

            const typing =
                document.getElementById("typing");

            const word =
                words[wordIndex];


            if (!deleting) {

                typing.textContent =
                    word.substring(
                        0,
                        charIndex + 1
                    );

                charIndex++;


                if (charIndex === word.length) {

                    deleting = true;

                    setTimeout(
                        typeEffect,
                        1500
                    );

                    return;
                }

            }

            else {

                typing.textContent =
                    word.substring(
                        0,
                        charIndex - 1
                    );

                charIndex--;


                if (charIndex === 0) {

                    deleting = false;

                    wordIndex =
                        (wordIndex + 1)
                        % words.length;
                }
            }


            setTimeout(

                typeEffect,

                deleting ? 60 : 100

            );
        }


        typeEffect();



        /* =========================================
           3D MOUSE MOVEMENT
        ========================================= */

        const card =
            document.getElementById("card");


        document.addEventListener(
            "mousemove",
            function(e) {

                const x =
                    (window.innerWidth / 2
                    - e.clientX) / 35;


                const y =
                    (window.innerHeight / 2
                    - e.clientY) / 35;


                card.style.transform =

                    `rotateY(${x}deg)
                     rotateX(${y}deg)`;

            }
        );


        /* =========================================
           RESET CARD WHEN MOUSE LEAVES
        ========================================= */

        document.addEventListener(
            "mouseleave",
            function() {

                card.style.transform =
                    "rotateY(0deg) rotateX(0deg)";
            }
        );



        /* =========================================
           PARTICLE EXPLOSION
        ========================================= */

        function celebrate() {


            for (let i = 0; i < 60; i++) {


                const particle =
                    document.createElement("div");


                particle.style.position =
                    "fixed";


                particle.style.left =
                    "50%";


                particle.style.top =
                    "50%";


                particle.style.width =
                    "6px";


                particle.style.height =
                    "6px";


                particle.style.borderRadius =
                    "50%";


                particle.style.background =
                    "white";


                particle.style.boxShadow =
                    "0 0 15px #8b5cf6";


                particle.style.zIndex =
                    "100";


                const angle =
                    Math.random()
                    * Math.PI * 2;


                const distance =
                    Math.random()
                    * 500 + 100;


                const duration =
                    Math.random()
                    * 700 + 700;


                particle.animate(

                    [

                        {
                            transform:
                                "translate(-50%, -50%) scale(1)",

                            opacity: 1
                        },


                        {

                            transform:

                                `translate(
                                    ${Math.cos(angle) * distance}px,
                                    ${Math.sin(angle) * distance}px
                                )
                                scale(0)`,

                            opacity: 0
                        }

                    ],

                    {

                        duration:
                            duration,

                        easing:
                            "cubic-bezier(.2,.8,.2,1)"
                    }

                );


                document.body.appendChild(
                    particle
                );


                setTimeout(

                    () => particle.remove(),

                    duration + 100

                );

            }

        }

    </script>

</body>
